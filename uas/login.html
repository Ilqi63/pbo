<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Login Ilqi - Pro</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', sans-serif;
    }

    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      /* Animasi background bergerak */
      background: linear-gradient(-45deg, #0f2027, #203a43, #2c5364, #203a43);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Efek Glassmorphism yang lebih kuat */
    .box {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      padding: 40px;
      width: 380px;
      border-radius: 28px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.3);
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .avatar {
      width: 80px;
      height: 80px;
      background: #3498db;
      border-radius: 50%;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      color: white;
      box-shadow: 0 10px 20px rgba(52, 152, 219, 0.3);
    }

    h2 { margin: 0; color: #2c3e50; }
    .subtitle { color: #7f8c8d; font-size: 14px; margin-bottom: 25px; }

    /* Pesan Error Custom */
    #errorMsg {
      background: #ffeaa7;
      color: #d63031;
      padding: 10px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 15px;
      display: none;
      border: 1px solid #fab1a0;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 15px;
      border-radius: 12px;
      border: 1px solid #dfe6e9;
      background: rgba(249, 249, 249, 0.8);
      font-size: 15px;
      transition: all 0.3s;
    }

    input:focus {
      outline: none;
      border-color: #3498db;
      box-shadow: 0 0 0 4px rgba(52, 152, 219, 0.1);
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 600;
      transition: all 0.3s ease;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #loginBtn { background: #3498db; color: white; margin-top: 10px; }
    #loginBtn:hover { background: #2980b9; transform: translateY(-2px); }

    #cancelBtn {
      margin-top: 12px;
      background: transparent;
      color: #95a5a6;
      border: 1px solid #dfe6e9;
    }

    /* Animasi Loading Spinner */
    .spinner {
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255,255,255,0.3);
      border-top: 3px solid white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 10px;
      display: none;
    }

    @keyframes spin { 100% { transform: rotate(360deg); } }

    #logoutBtn { background: #ff7675; color: white; margin-top: 20px; }
  </style>
</head>
<body>

  <div class="box" id="app"></div>

  <script>
    class LoginApp {
      constructor(containerId) {
        this.container = document.getElementById(containerId);
        this.initData();
        this.renderLogin();
      }

      initData() {
        const users = [{ username: 'ilqi', password: 'ilq123' }];
        localStorage.setItem('users', JSON.stringify(users));
      }

      renderLogin() {
        this.container.innerHTML = `
          <div class="avatar">👤</div>
          <h2>Selamat Datang</h2>
          <p class="subtitle">Silakan masuk ke akun Anda</p>
          
          <div id="errorMsg">Username atau password salah!</div>

          <input type="text" id="username" placeholder="Username">
          <input type="password" id="password" placeholder="Password">
          
          <button id="loginBtn">
            <div class="spinner" id="loader"></div>
            <span id="btnText">Masuk Sekarang</span>
          </button>
          
          <button id="cancelBtn">Bersihkan</button>
        `;

        document.getElementById('loginBtn').addEventListener('click', () => this.handleLogin());
        document.getElementById('cancelBtn').addEventListener('click', () => this.cancel());
      }

      handleLogin() {
        const userInp = document.getElementById('username').value;
        const passInp = document.getElementById('password').value;
        const loader = document.getElementById('loader');
        const btnText = document.getElementById('btnText');
        const errorMsg = document.getElementById('errorMsg');

        // Efek Loading
        loader.style.display = 'block';
        btnText.innerText = 'Memproses...';
        errorMsg.style.display = 'none';

        setTimeout(() => {
          const users = JSON.parse(localStorage.getItem('users'));
          const found = users.find(u => u.username === userInp && u.password === passInp);

          if (found) {
            this.renderUserPage(found.username);
          } else {
            loader.style.display = 'none';
            btnText.innerText = 'Masuk Sekarang';
            errorMsg.style.display = 'block';
          }
        }, 1200); // Simulasi delay loading 1.2 detik
      }

      renderUserPage(username) {
        this.container.innerHTML = `
          <div style="font-size: 60px; margin-bottom: 15px;">✨</div>
          <h2>Halo, ${username}!</h2>
          <p>Akses diterima. Selamat bekerja di sistem kami.</p>
          <button id="logoutBtn">Keluar Sistem</button>
        `;
        document.getElementById('logoutBtn').addEventListener('click', () => this.renderLogin());
      }

      cancel() {
        document.getElementById('username').value = '';
        document.getElementById('password').value = '';
        document.getElementById('errorMsg').style.display = 'none';
      }
    }

    new LoginApp('app');
  </script>
</body>
</html>
