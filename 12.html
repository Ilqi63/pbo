<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>GUI Sederhana</title>
</head>
<body>
    <h1 id="title">Halo, Mahasiswa!</h1>
    
    <button onclick="ubahTeks()">Klik Saya</button>
    
    <script>
        /**
         * Fungsi ini mengubah teks dari elemen <h1> 
         * dengan id "title".
         */
        function ubahTeks() {
            // Mengambil elemen berdasarkan ID dan mengubah teksnya
            document.getElementById("title").innerText = "Teks telah berubah!";
        }
    </script>
</body>
</html>
